# Kamal's deploy config, which Hoster reads from the repository (and fills
# in: servers, registry, builder, the domains). Each install is its own app
# or environment: Hoster renames the service to that app's, and the volume
# with it (runwell-data becomes brem-data), so every install gets a volume
# of its own. Set SITE_KEY (and, if you like, APP_URL) per install under
# Variables. docs/going-live.html walks through it.
service: runwell
image: runwell

proxy:
  # The image listens on 80, where kamal-proxy sends traffic.
  app_port: 80
  healthcheck:
    path: /up

# Everything the install keeps: its database, uploaded files and secret key.
# Runwell refuses to start without a persistent volume here.
volumes:
  - runwell-data:/data

env:
  clear:
    # kamal-proxy is in front: client addresses come from X-Forwarded-For.
    TRUST_PROXY: "1"
    LOG_FORMAT: json
